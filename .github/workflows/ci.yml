name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Frontend — format, lint, types, tests, locales
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build frontend (needed by tauri::generate_context!)
        run: pnpm --filter @momentum/desktop build

      - name: Rust — fmt, clippy, tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: TypeScript bindings are up to date
        run: git diff --exit-code -- apps/desktop/src/bindings.ts
