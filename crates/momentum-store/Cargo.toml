[package]
name = "momentum-store"
description = "Momentum local persistence: SQLite, versioned migrations, repositories."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
momentum-core = { path = "../momentum-core" }
rusqlite = { version = "0.43", features = ["bundled"] }
rusqlite_migration = "2.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
