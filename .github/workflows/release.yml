name: Release

# Pushing a tag `vX.Y.Z` builds all targets and attaches installers + signed updater artifacts
# to a draft GitHub Release. Code-signing steps run only when their secrets exist (ADR-015).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: macOS universal,
              runner: macos-14,
              target: universal-apple-darwin,
              rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin",
              bundles: "app,dmg",
            }
          - {
              name: Windows x64,
              runner: windows-latest,
              target: x86_64-pc-windows-msvc,
              rust-targets: x86_64-pc-windows-msvc,
              bundles: "msi,nsis",
            }
          - {
              name: Windows ARM64,
              runner: windows-11-arm,
              target: aarch64-pc-windows-msvc,
              rust-targets: aarch64-pc-windows-msvc,
              bundles: nsis,
            }
          - {
              name: Linux x64,
              runner: ubuntu-22.04,
              target: x86_64-unknown-linux-gnu,
              rust-targets: x86_64-unknown-linux-gnu,
              bundles: "appimage,deb,rpm",
            }
          - {
              name: Linux ARM64,
              runner: ubuntu-22.04-arm,
              target: aarch64-unknown-linux-gnu,
              rust-targets: aarch64-unknown-linux-gnu,
              bundles: "appimage,deb,rpm",
            }

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # --- Optional Apple signing / notarization (slot) ---------------------------------------
      - name: Import Apple certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci build.keychain
          rm certificate.p12

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signature (required for auto-update; see docs/DECISIONS.md ADR-020).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple (optional): used by the Tauri bundler when present.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Momentum ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: >-
            --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
            --config src-tauri/tauri.release.conf.json

      # --- Optional Authenticode signing (slot) -------------------------------------------
      # When WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD secrets are added, configure
      # bundle.windows.certificateThumbprint or a signCommand (e.g. Azure Trusted Signing).
