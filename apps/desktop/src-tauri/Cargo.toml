[package]
name = "momentum"
description = "Momentum — focus in sessions, block distractions, see your progress."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "momentum"

[lib]
name = "momentum_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
momentum-core = { path = "../../../crates/momentum-core", features = ["specta"] }
momentum-store = { path = "../../../crates/momentum-store" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "0.0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"

[features]
# Passed by the Tauri CLI for production builds.
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
